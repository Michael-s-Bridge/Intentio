<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intentio — Pause</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: system-ui, sans-serif;
        max-width: 600px;
        margin: 10vh auto;
        padding: 2rem;
        background: #f9f9f9;
        color: #1a1a1a;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }

      .destination-label {
        margin: 0 0 0.4rem;
        color: #555;
        font-size: 0.9rem;
      }

      .destination {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 0.75rem 1rem;
        word-break: break-all;
        margin-bottom: 2rem;
        font-size: 0.9rem;
        color: #444;
      }

      /* ── Question block ─────────────────────────────────── */
      .question {
        margin-bottom: 1.5rem;
      }

      .question-text {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
      }

      textarea {
        width: 100%;
        padding: 0.6rem 0.75rem;
        font-size: 0.95rem;
        font-family: inherit;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: vertical;
        background: #fff;
        color: #1a1a1a;
        transition: border-color 0.15s;
      }

      textarea:focus {
        outline: none;
        border-color: #2563eb;
      }

      /* ── Bool toggle buttons ────────────────────────────── */
      .bool-group {
        display: flex;
        gap: 0.5rem;
      }

      .bool-btn {
        padding: 0.45rem 1.1rem;
        font-size: 0.95rem;
        font-family: inherit;
        cursor: pointer;
        border: 2px solid #ccc;
        border-radius: 4px;
        background: #fff;
        color: #444;
        transition: border-color 0.15s, background 0.15s, color 0.15s;
      }

      .bool-btn:hover {
        border-color: #2563eb;
        color: #2563eb;
      }

      /* Selected state — visually distinct, no browser default needed */
      .bool-btn.selected {
        border-color: #2563eb;
        background: #2563eb;
        color: #fff;
      }

      /* ── Continue button ────────────────────────────────── */
      #continue-btn {
        display: block;
        margin-top: 2rem;
        padding: 0.65rem 1.6rem;
        font-size: 1rem;
        font-family: inherit;
        cursor: pointer;
        border: none;
        border-radius: 4px;
        background: #2563eb;
        color: #fff;
        transition: background 0.15s;
      }

      #continue-btn:hover:not(:disabled) {
        background: #1d4ed8;
      }

      #continue-btn:disabled {
        background: #93afd8;
        cursor: not-allowed;
      }

      /* ── Temporary allow ────────────────────────────────── */
      .temp-allow {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid #e5e5e5;
      }

      .temp-allow-label {
        margin: 0 0 0.5rem;
        font-size: 0.85rem;
        color: #666;
      }

      .temp-allow-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .temp-btn {
        padding: 0.45rem 0.9rem;
        font-size: 0.9rem;
        font-family: inherit;
        cursor: pointer;
        border: 1px solid #2563eb;
        border-radius: 4px;
        background: #fff;
        color: #2563eb;
        transition: background 0.15s, color 0.15s;
      }

      .temp-btn:hover:not(:disabled) {
        background: #2563eb;
        color: #fff;
      }

      .temp-btn:disabled {
        border-color: #ccc;
        color: #aaa;
        cursor: not-allowed;
      }

      .stats-bar {
        font-size: 0.85rem;
        color: #666;
        margin: 0 0 1.5rem;
        min-height: 1.2em; /* prevent layout shift while loading */
      }

      .log-link {
        display: inline-block;
        margin-top: 1rem;
        font-size: 0.85rem;
        color: #2563eb;
        text-decoration: none;
      }
      .log-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Pause before you go</h1>
    <p id="stats-bar" class="stats-bar"></p>
    <p class="destination-label">You're trying to visit:</p>
    <div class="destination" id="dest-url"></div>

    <form id="question-form">
      <!-- questions are rendered here by interrupt.js -->
    </form>

    <button id="continue-btn" disabled>
      Continue (<span id="countdown">3</span>)
    </button>

    <div class="temp-allow" id="temp-allow-section" style="display: none;">
      <p class="temp-allow-label">Or skip the prompt for a while:</p>
      <div class="temp-allow-row">
        <button id="temp-tab-btn" class="temp-btn" type="button" disabled style="display: none;"></button>
        <button id="temp-domain-btn" class="temp-btn" type="button" disabled style="display: none;"></button>
      </div>
    </div>

    <a id="log-link" class="log-link" href="#">View log</a>
    <a id="settings-link" class="log-link" href="#">Settings</a>

    <!-- type="module" enables ES import syntax; MV3 extension pages support it -->
    <script type="module" src="interrupt.js"></script>
  </body>
</html>
