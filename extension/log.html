<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intentio — Log</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: system-ui, sans-serif;
        margin: 6vh 0.5in;
        padding: 2rem 0;
        background: #f9f9f9;
        color: #1a1a1a;
      }

      .table-scroll {
        overflow-x: auto;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }

      /* ── Table styles ───────────────────────────────────── */
      /* Auto layout so columns size to their actual content by default —
         only a column the user has manually dragged wider/narrower gets an
         explicit width (applied via its <col>), overriding this. */
      table {
        width: 100%;
        table-layout: auto;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      th {
        position: relative;
        text-align: left;
        padding: 0.5rem 0.75rem;
        border-bottom: 2px solid #ddd;
        font-weight: 600;
        color: #555;
      }

      td {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid #eee;
        vertical-align: top;
        overflow-wrap: break-word;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .on-track-yes { color: #16a34a; font-weight: 500; }
      .on-track-no  { color: #dc2626; font-weight: 500; }

      .url-cell {
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #444;
      }

      /* Question header/cells wrap rather than stretch the table, unless
         the user has manually widened the column. */
      th.q-col, td.q-col {
        max-width: 220px;
      }
      th.q-col {
        font-weight: 500;
      }

      /* Header cell contents: drag handle, label, resize handle */
      .th-inner {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      .col-label {
        flex: 1;
        min-width: 0;
        white-space: normal;
        cursor: pointer;
      }
      .col-label:hover {
        text-decoration: underline;
      }
      .sort-indicator {
        margin-left: 0.25rem;
        font-size: 0.7rem;
      }
      .col-drag-handle {
        flex-shrink: 0;
        cursor: grab;
        color: #bbb;
        font-size: 0.7rem;
        user-select: none;
      }
      .col-drag-handle:hover { color: #888; }
      .col-resize-handle {
        position: absolute;
        top: 0;
        right: -4px;
        bottom: 0;
        width: 8px;
        cursor: col-resize;
        z-index: 1;
      }
      .col-resize-handle:hover,
      .col-resize-handle.active {
        background: #93c5fd;
      }
      th.drag-over {
        outline: 2px dashed #2563eb;
        outline-offset: -2px;
      }

      /* ── Branch table headings ─────────────────────────────── */
      .branch-heading-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 2rem 0 0.5rem;
      }
      .branch-heading-row:first-of-type {
        margin-top: 0.5rem;
      }
      .branch-heading-row.drag-over {
        outline: 2px dashed #2563eb;
        outline-offset: 2px;
      }
      .collapse-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.8rem;
        color: #888;
        padding: 0.1rem 0.3rem;
        border-radius: 3px;
      }
      .collapse-btn:hover { color: #333; background: #f0f0f0; }
      .group-drag-handle {
        cursor: grab;
        color: #bbb;
        font-size: 0.8rem;
        user-select: none;
      }
      .group-drag-handle:hover { color: #888; }
      .branch-heading-text {
        font-size: 1.05rem;
        font-weight: 600;
        color: #333;
      }

      .empty-table-msg {
        color: #999;
        font-style: italic;
        font-size: 0.9rem;
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <div class="nav" style="margin-bottom:1.5rem; font-size:0.875rem;">
      <a id="settings-link" href="#" style="color:#2563eb; text-decoration:none; margin-right:1rem;">Settings</a>
    </div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:0.5rem;">
      <h1 style="margin:0;">Redirect log</h1>
      <button id="clear-btn" style="font-size:0.8rem; padding:0.3rem 0.75rem; cursor:pointer; border:1px solid #ddd; border-radius:4px; background:#fff; color:#666;">Clear log</button>
    </div>
    <p id="empty-msg" style="display:none; color:#666;">No redirects logged yet.</p>
    <div id="log-container"></div>

    <div style="display:flex; align-items:baseline; justify-content:space-between; margin:3rem 0 0.5rem;">
      <h1 style="margin:0; font-size:1.25rem;">Pauses</h1>
      <button id="clear-pauses-btn" style="font-size:0.8rem; padding:0.3rem 0.75rem; cursor:pointer; border:1px solid #ddd; border-radius:4px; background:#fff; color:#666;">Clear pause log</button>
    </div>
    <p id="pause-empty-msg" style="display:none; color:#666;">No pauses logged yet.</p>
    <div class="table-scroll">
      <table id="pause-table" style="display:none;">
        <thead>
          <tr><th>Time</th><th>Duration</th><th>Reason</th></tr>
        </thead>
        <tbody id="pause-body"></tbody>
      </table>
    </div>

    <script type="module" src="log.js"></script>
  </body>
</html>
